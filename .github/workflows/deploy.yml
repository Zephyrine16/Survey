name: CI/CD Pipeline

on:
  push:
    branches: [ main ] # Runs CI and deploys when pushing to main
  pull_request:
    branches: [ main ] # Runs CI checks for PRs targeting main (deploy step skipped)
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  # --- BACKEND CI/CD ---
  build-and-deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        run: |
          cd backend
          chmod +x ./mvnw
          sed -i 's/\r$//' ./mvnw

      - name: Build and Test Backend with Maven
        run: |
          cd backend
          ./mvnw clean package

      - name: Trigger Render Backend Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RENDER_BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_HOOK }}
        run: |
          if [ -z "$RENDER_BACKEND_HOOK" ]; then
            echo "::error::Secret RENDER_BACKEND_HOOK is not configured in GitHub Secrets! Add it in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Triggering Render backend deployment..."
          curl -f -sS -X POST "$RENDER_BACKEND_HOOK"

  # --- FRONTEND CI/CD ---
  build-and-test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vue Build Environment (Node 20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Audit Dependencies
        run: |
          cd frontend
          npm audit --audit-level=high || true

      - name: Type Check & Unit Tests
        run: |
          cd frontend
          npm run type-check
          npx vitest run

      - name: Build Vue Production Bundle
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://api.survey.example.com' }}
        run: |
          cd frontend
          npm run build