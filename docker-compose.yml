services:
  postgres-db:
    image: postgres:15-alpine
    container_name: survey-postgres
    restart: always
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: survey-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres-db
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres-db:5432/postgres
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:5173
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: survey-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
volumes:
  postgres_data:
  backend_uploads: